# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: "Proyek Sains Data IF2231: Klasterisasi Polutan Jabon dan Klasifikasi Lahan Jawa Timur"
author: The Jupyter Book Community
logo: logo.png

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: off

# Hanya berkas yang ada di _toc.yml yang dibangun/diterbitkan.
only_build_toc_files: true

# File besar / mentah tidak ikut build (raster, model, data mentah).
exclude_patterns:
  - data/*
  - outputs/raster/*
  - outputs/models/*
  - outputs/tables/*.pkl
  - outputs/tables/*.npz
  - 07_klasifikasi_lahan_jatim/data/*
  - 07_klasifikasi_lahan_jatim/outputs/raster/*
  - 07_klasifikasi_lahan_jatim/outputs/models/*
  - 07_klasifikasi_lahan_jatim/outputs/tables/*.pkl
  - 07_klasifikasi_lahan_jatim/outputs/tables/*.npz
  - prompt/*
  - .venv/*
  - __pycache__/*
  - _build/*

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/Rahardian-Ananta/PSD
  path_to_book: ""
  branch: main

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
